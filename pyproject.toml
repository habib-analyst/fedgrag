[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fedgrag"
version = "0.1.0"
description = "Open replication of federated graph retrieval routing (arXiv 2610.30728), synthetic corpus, CPU only"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
